<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Morning Rayne</title>
  <desc id="desc">A pale blue sky with drifting clouds and falling rain, framing the Morning Rayne title.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf6fb"/><stop offset=".55" stop-color="#d5e9f6"/><stop offset="1" stop-color="#bcd8e9"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#f7fbff" stop-opacity=".74"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="330" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#sky)"/><circle cx="1050" cy="35" r="220" fill="#fff" opacity=".15"/><circle cx="110" cy="315" r="250" fill="#fff" opacity=".16"/>
    <g fill="url(#cloud)" opacity=".8"><g><animateTransform attributeName="transform" type="translate" values="-20 0;20 0;-20 0" dur="18s" repeatCount="indefinite"/><circle cx="875" cy="102" r="42"/><circle cx="930" cy="78" r="58"/><circle cx="985" cy="105" r="43"/><rect x="858" y="98" width="150" height="52" rx="26"/></g>
    <g opacity=".56"><animateTransform attributeName="transform" type="translate" values="10 0;-15 0;10 0" dur="24s" repeatCount="indefinite"/><circle cx="100" cy="230" r="33"/><circle cx="142" cy="209" r="45"/><circle cx="185" cy="231" r="32"/><rect x="85" y="225" width="115" height="38" rx="19"/></g></g>
    <g stroke="#6d9fc1" stroke-width="2" stroke-linecap="round" opacity=".75"><path d="M840 172 l-7 20"><animate attributeName="opacity" values=".15;.85;.15" dur="1.5s" repeatCount="indefinite"/></path><path d="M890 188 l-7 20"><animate attributeName="opacity" values=".85;.15;.85" dur="1.8s" repeatCount="indefinite"/></path><path d="M940 172 l-7 20"><animate attributeName="opacity" values=".2;.9;.2" dur="1.3s" repeatCount="indefinite"/></path><path d="M990 188 l-7 20"><animate attributeName="opacity" values=".9;.2;.9" dur="1.7s" repeatCount="indefinite"/></path></g>
    <text x="58" y="63" fill="#527b9a" font-family="monospace" font-size="15" letter-spacing="5">A LITTLE WEATHER, ALWAYS</text>
    <text x="52" y="177" fill="#233c50" font-family="Georgia, 'Times New Roman', serif" font-size="91" letter-spacing="-4">Morning Rayne</text>
    <circle cx="65" cy="227" r="4" fill="#6d9b88"/><text x="82" y="233" fill="#47647a" font-family="Arial, Helvetica, sans-serif" font-size="20">Pour your coffee — it’s time for your favorite morning talk.</text>
    <path d="M58 270 H520" stroke="#527b9a" stroke-opacity=".35"/><text x="58" y="302" fill="#527b9a" font-family="monospace" font-size="13" letter-spacing="3">LISTEN · READ · FOLLOW</text>
  </g>
</svg>
